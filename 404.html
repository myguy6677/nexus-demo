<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #0f0f1a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a8;
      --text-muted: #555570;
      --accent-cyan: #00f0ff;
      --accent-purple: #8b5cf6;
      --font-primary: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .error-container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: glitch-pulse 3s ease-in-out infinite;
    }

    @keyframes glitch-pulse {
      0%, 100% { opacity: 1; filter: blur(0); }
      50% { opacity: 0.85; filter: blur(0.5px); }
    }

    .error-title {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 500;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .error-message {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 400px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    .error-terminal {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border: 1px solid rgba(136, 136, 168, 0.12);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      max-width: 360px;
      margin: 0 auto 2.5rem;
      text-align: left;
    }

    .error-terminal .prompt { color: var(--accent-cyan); }
    .error-terminal .output { color: #f87171; margin-top: 4px; }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 36px;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      background: transparent;
      border-radius: 8px;
      font-family: var(--font-primary);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .error-btn:hover {
      background: var(--accent-cyan);
      color: var(--bg-primary);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Background particles */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(136,136,168,0.06) 1px, transparent 0);
      background-size: 40px 40px;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      z-index: 0;
    }

    .bg-glow-1 {
      top: -100px;
      left: -100px;
      background: var(--accent-cyan);
    }

    .bg-glow-2 {
      bottom: -100px;
      right: -100px;
      background: var(--accent-purple);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
    <div class="error-terminal">
      <div><span class="prompt">$</span> nexus resolve /unknown-path</div>
      <div class="output">[ERROR] Route not found. Redirecting to home...</div>
    </div>
    <a href="index.html" class="error-btn">
      Back to Home
      <span>&rarr;</span>
    </a>
  </div>
</body>
</html>
